    function listenToFirestore() {
      docRef.onSnapshot((doc) => {
        const statusEl = document.getElementById("cloudStatus");
        if (doc.exists) {
          const data = doc.data();
          if (data.vdvs && data.vdvs.length > 0) vdvs = data.vdvs;
          dates = data.dates || [];
          
          // Tạo ngày hôm nay chuẩn định dạng d/m/yy
          const nowObj = new Date();
          const todayStr = `${nowObj.getDate()}/${nowObj.getMonth() + 1}/${nowObj.getFullYear().toString().substr(-2)}`;
          if (!dates.includes(todayStr)) {
            dates.unshift(todayStr); // Đưa ngày hôm nay lên đầu
          }

          matchesData = data.matchesData || {};
          dateKeoMode = data.dateKeoMode || {};
          paymentStatus = data.paymentStatus || {};

            miniGame1Matches = DEFAULT_MINI1_DATA;
          }

          // Tự động mở Ngày hiện tại hoặc ngày gần nhất
          if (!currentTab || (!dates.includes(currentTab) && currentTab !== "tonghop" && currentTab !== "minigame1")) {

      const now = new Date();
      let closestDate = dateArray[0];
      let minDiff = Infinity;

      const parseDateStr = (str) => {
        const parts = str.split('/');
        if (parts.length === 3) {
          let day = parseInt(parts[0], 10);
          let month = parseInt(parts[1], 10) - 1;
          let year = parseInt(parts[2], 10);
          if (year < 100) year += 2000;
          return new Date(year, month, day);
        }
        return new Date(0);
      };

      dateArray.forEach(dStr => {
        const dObj = parseDateStr(dStr);
        const diff = Math.abs(now - dObj);
        if (diff < minDiff) {
          minDiff = diff;
          closestDate = dStr;
        }
      });
      return closestDate;
    }

        const trimmed = newDate.trim();

      miniGame1Matches.forEach(m => {
        const sa = parseInt(m.scoreA);
        const sb = parseInt(m.scoreB);
        if (!isNaN(sa) && !isNaN(sb)) {
          if (sa > sb) scoreTeamA++;
          else if (sb > sa) scoreTeamB++;
        }
      });

      let html = `
        <div class="summary-score-card">
          <div class="score-box">
            <div style="font-weight:bold; color:#4ade80;">TEAM A</div>
            <div class="score-number">${scoreTeamA}</div>
          </div>
          <div style="font-size:20px; font-weight:bold;">VS</div>
          <div class="score-box">
            <div style="font-weight:bold; color:#38bdf8;">TEAM B</div>
            <div class="score-number">${scoreTeamB}</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header-flex">
            <h2 class="card-title">🎮 LỊCH THI ĐẤU MINI GAME 1 (24 TRẬN)</h2>
          </div>
          <div style="background:#f8fafc; padding:8px; border-radius:6px; font-size:11px; margin-bottom:10px; border:1px dashed #cbd5e1;">
            <b>Thể lệ:</b> ${miniGame1Content}
          </div>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th style="width:40px;">STT</th>
                  <th>THỂ LOẠI</th>
                  <th colspan="2" class="th-team-a">TEAM A</th>
                  <th style="width:80px;">TỶ SỐ</th>
                  <th colspan="2" class="th-team-b">TEAM B</th>
                </tr>
              </thead>
              <tbody>
      `;

      miniGame1Matches.forEach((m, idx) => {
        html += `
          <tr>
            <td><b>${m.id}</b></td>
            <td><input type="text" value="${m.category || ''}" onchange="updateMini1Match(${idx}, 'category', this.value)"></td>
            <td><select onchange="updateMini1Match(${idx}, 'a1', this.value)">${generateVdvOptionsHtml(m.a1)}</select></td>
            <td><select onchange="updateMini1Match(${idx}, 'a2', this.value)">${generateVdvOptionsHtml(m.a2)}</select></td>
            <td>
              <div style="display:flex; align-items:center; justify-content:center; gap:2px;">
                <input type="text" class="score-input" value="${m.scoreA || ''}" onchange="updateMini1Match(${idx}, 'scoreA', this.value)">
                <span>-</span>
                <input type="text" class="score-input" value="${m.scoreB || ''}" onchange="updateMini1Match(${idx}, 'scoreB', this.value)">
              </div>
            </td>
            <td><select onchange="updateMini1Match(${idx}, 'b1', this.value)">${generateVdvOptionsHtml(m.b1)}</select></td>
            <td><select onchange="updateMini1Match(${idx}, 'b2', this.value)">${generateVdvOptionsHtml(m.b2)}</select></td>
          </tr>
        `;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    /* -------------------------------------------------------------
        XUẤT DỮ LIỆU EXCEL
    ------------------------------------------------------------- */
    function exportToExcel() {
      const wb = XLSX.utils.book_new();

      // Xuất bảng từng ngày
      dates.forEach(dStr => {
        const matches = matchesData[dStr] || [];
        const wsData = [
          ["STT", "CẶP PICK 1 - VĐV 1", "CẶP PICK 1 - VĐV 2", "CẶP PICK 2 - VĐV 1", "CẶP PICK 2 - VĐV 2", "TỶ SỐ 1", "TỶ SỐ 2"]
        ];

        matches.forEach((m, idx) => {
          wsData.push([
            idx + 1, m.c1_p1 || "", m.c1_p2 || "", m.c2_p1 || "", m.c2_p2 || "", m.score1 || "", m.score2 || ""
          ]);
        });

        const ws = XLSX.utils.aoa_to_sheet(wsData);
        // Clean sheet name
        const sheetName = dStr.replace(/[/\\?*:[\]]/g, "_");
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
      });

      XLSX.writeFile(wb, "Thong_Ke_Pickleball_CMTD.xlsx");
    }
  </script>
</body>
</html>
